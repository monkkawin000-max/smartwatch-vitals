name: Build Doctor APK

# แอปหมอ (ห่อหน้าเว็บ ไม่มี Bluetooth) → ไฟล์ vitals-doctor.apk
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-doctor.yml'

env:
  DOCTOR_URL: https://smartwatch-vitals.onrender.com/%E0%B8%AB%E0%B8%A1%E0%B8%AD/login.html

jobs:
  # ----- แอปหมอ: ห่อหน้าเว็บหมอ ไม่มี Bluetooth ไม่มีบริการเบื้องหลัง (แยกแอป แยกที่เก็บล็อกอินจากแอปคนไข้) -----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: สร้างโปรเจกต์แอปหมอ
        run: |
          mkdir app-doctor && cd app-doctor
          mkdir www
          cat > package.json <<'JSON'
          {
            "name": "smartwatch-vitals-doctor",
            "version": "0.1.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<JSON
          {
            "appId": "com.monk.smartwatchvitals.doctor",
            "appName": "Vitals Doctor",
            "webDir": "www",
            "server": { "url": "${DOCTOR_URL}", "cleartext": false }
          }
          JSON
          cat > www/index.html <<HTML
          <!doctype html>
          <html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Vitals Doctor</title></head>
          <body style="font-family:sans-serif;text-align:center;padding:40px">
          <h2>Vitals Doctor</h2><p>เปิดแอปไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง</p>
          <a href="${DOCTOR_URL}">เปิดหน้าเข้าสู่ระบบ</a></body></html>
          HTML

      - name: ติดตั้งและสร้างโปรเจกต์ Android
        working-directory: app-doctor
        run: |
          npm install
          npx cap add android

      - name: ตั้งไอคอนแอป
        run: |
          pip install pillow --break-system-packages || pip install pillow
          cat > icon.b64 <<'B64'
          iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAApIUlEQVR42u2dfZxcRZnvf09VnX6dt7yHGCABAiQgBAIqLBoCCyii
