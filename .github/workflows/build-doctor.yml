          from PIL import Image
          import glob, os
          RES = 'app-doctor/android/app/src/main/res'
          for f in glob.glob(RES + '/mipmap-anydpi*/*'):
              os.remove(f)
          src = Image.open('icon.png').convert('RGBA')
          for d, s in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
              folder = RES + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              for old in glob.glob(folder + '/ic_launcher*'):
                  os.remove(old)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(folder + '/ic_launcher.png')
              img.save(folder + '/ic_launcher_round.png')
          PY

      - name: สร้างไฟล์ APK
        working-directory: app-doctor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: ตั้งชื่อไฟล์ APK
        run: cp app-doctor/android/app/build/outputs/apk/debug/app-debug.apk vitals-doctor.apk

      - name: อัปโหลด APK
        uses: actions/upload-artifact@v4
        with:
          name: vitals-doctor-apk
          path: vitals-doctor.apk
