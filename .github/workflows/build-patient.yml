name: Build Patient APK

# แอปคนไข้ (มี Bluetooth + บริการเบื้องหลัง) → ไฟล์ vitals-patient.apk
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-patient.yml'

env:
  APP_URL: https://smartwatch-vitals.onrender.com/mockup-patient/login.html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: สร้างโปรเจกต์แอป
        run: |
          mkdir app && cd app
          mkdir www
          cat > package.json <<'JSON'
          {
            "name": "smartwatch-vitals-app",
            "version": "0.1.0",
            "private": true,
            "dependencies": {
              "@capacitor-community/bluetooth-le": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<JSON
          {
            "appId": "com.monk.smartwatchvitals",
            "appName": "Smartwatch Vitals",
            "webDir": "www",
            "server": { "url": "${APP_URL}", "cleartext": false }
          }
          JSON
          cat > www/index.html <<HTML
          <!doctype html>
          <html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Smartwatch Vitals</title></head>
          <body style="font-family:sans-serif;text-align:center;padding:40px">
          <h2>Smartwatch Vitals</h2><p>เปิดแอปไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง</p>
          <a href="${APP_URL}">เปิดหน้าเข้าสู่ระบบ</a></body></html>
          HTML

      - name: ติดตั้งและสร้างโปรเจกต์ Android
        working-directory: app
        run: |
          npm install
          npx cap add android

      - name: เพิ่มบริการเชื่อมนาฬิกาเบื้องหลัง (Foreground Service)
        working-directory: app
        run: |
          D=android/app/src/main/java/com/monk/smartwatchvitals
          test -d "$D"
          cat > "$D/WatchService.java" <<'JAVA_EOF'
          package com.monk.smartwatchvitals;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattDescriptor;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.webkit.CookieManager;

          import org.json.JSONObject;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;
          import java.util.TimeZone;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicInteger;

          /** บริการเบื้องหลัง: ต่อนาฬิกา Y19PRO, อ่านค่า, และส่งเข้าระบบเองแม้พับแอป */
          public class WatchService extends Service {
              static final String ACTION_STOP = "com.monk.smartwatchvitals.STOP";
              static final UUID SERVICE_UUID = UUID.fromString("6e400801-b5a3-f393-e0a9-e50e24dcca9d");
              static final UUID NOTIFY_UUID = UUID.fromString("6e400003-b5a3-f393-e0a9-e50e24dcca9d");
              // นาฬิกาแบบที่ 2 (Lefun Health / "SMART WATCH"): service 0x18D0, ตัวรับ 0x2D00 — ส่งผลวัดทีละอย่างตอนวัดเสร็จ
              static final UUID SERVICE_B_UUID = UUID.fromString("000018d0-0000-1000-8000-00805f9b34fb");
              static final UUID NOTIFY_B_UUID = UUID.fromString("00002d00-0000-1000-8000-00805f9b34fb");
              static final UUID CCCD_UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");
              static final String CHANNEL_ID = "watch_conn";
              static final int NOTIF_ID = 7101;

              // สถานะที่หน้าเว็บอ่านผ่านปลั๊กอิน
              static volatile boolean running = false;
              static volatile String state = "idle"; // idle | connecting | connected | reconnecting
              static volatile int hr, sys, dia, spo2;
              static volatile long seq = 0;
              static volatile long lastPacketMs = 0;
              static volatile String clockLabel = "";
              static volatile String lastMsg = "";
              static volatile String profile = "";   // "A" = Y19PRO (ค่าครบในแพ็กเก็ตเดียว), "B" = วัดทีละอย่าง
              static volatile String kind = "";      // ผลล่าสุดเป็นชนิดไหน: hr | spo2 | bp (เฉพาะ B)
              static final AtomicInteger sent = new AtomicInteger(0);
              static final ConcurrentLinkedQueue<JSONObject> queue = new ConcurrentLinkedQueue<JSONObject>();

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ExecutorService net = Executors.newSingleThreadExecutor();
              private final AtomicBoolean flushing = new AtomicBoolean(false);
              private BluetoothGatt gatt;
              private String mac;
              private String baseUrl;
              private boolean stopping = false;
              private int backoff = 2000;
              private String lastQueuedAt = null;
              private volatile boolean useB = false;
              private String lastBKey = "";
              private long lastBMs = 0;

              private final Runnable reconnectRun = new Runnable() {
                  @Override public void run() { connect(); }
              };
              private final Runnable flushRun = new Runnable() {
                  @Override public void run() { flush(); }
              };

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      shutdown();
                      return START_NOT_STICKY;
                  }
                  SharedPreferences sp = getSharedPreferences("watch", MODE_PRIVATE);
                  if (intent != null && intent.hasExtra("mac")) {
                      mac = intent.getStringExtra("mac");
                      baseUrl = intent.getStringExtra("base");
                      sp.edit().putString("mac", mac).putString("base", baseUrl).putBoolean("on", true).apply();
                  } else {
                      mac = sp.getString("mac", null);
                      baseUrl = sp.getString("base", null);
                      if (!sp.getBoolean("on", false)) { stopSelf(); return START_NOT_STICKY; }
                  }
                  if (mac == null) { stopSelf(); return START_NOT_STICKY; }

                  try {
                      startFg(buildNotif("กำลังเชื่อมต่อนาฬิกา..."));
                  } catch (Exception e) {
                      lastMsg = "เริ่มบริการเบื้องหลังไม่ได้: " + e.getMessage();
                  }
                  running = true;
                  stopping = false;
                  connect();
                  return START_STICKY;
              }

              // ---------- Bluetooth ----------
              private void connect() {
                  handler.removeCallbacks(reconnectRun);
                  if (stopping) return;
                  try {
                      BluetoothManager bm = (BluetoothManager) getSystemService(BLUETOOTH_SERVICE);
                      BluetoothAdapter ad = bm == null ? null : bm.getAdapter();
                      if (ad == null || !ad.isEnabled()) {
                          setState("reconnecting", "Bluetooth ปิดอยู่ — เปิดแล้วจะต่อใหม่เอง");
                          scheduleReconnect();
                          return;
                      }
                      closeGatt();
                      BluetoothDevice d = ad.getRemoteDevice(mac);
                      setState("connecting", "กำลังเชื่อมต่อนาฬิกา...");
                      if (Build.VERSION.SDK_INT >= 23) {
                          gatt = d.connectGatt(this, false, cb, BluetoothDevice.TRANSPORT_LE);
                      } else {
                          gatt = d.connectGatt(this, false, cb);
                      }
                  } catch (Exception e) {
                      setState("reconnecting", "เชื่อมต่อไม่ได้: " + e.getMessage());
                      scheduleReconnect();
                  }
              }

              private void scheduleReconnect() {
                  if (stopping) return;
                  handler.removeCallbacks(reconnectRun);
                  handler.postDelayed(reconnectRun, backoff);
                  backoff = Math.min(backoff * 2, 30000);
              }

              private void closeGatt() {
                  BluetoothGatt g = gatt;
                  gatt = null;
                  if (g != null) {
                      try { g.disconnect(); } catch (Exception e) { }
                      try { g.close(); } catch (Exception e) { }
                  }
              }

              private final BluetoothGattCallback cb = new BluetoothGattCallback() {
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int status, int newState) {
                      try {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              backoff = 2000;
                              g.discoverServices();
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              try { g.close(); } catch (Exception e) { }
                              if (g == gatt) gatt = null;
                              if (!stopping) {
                                  setState("reconnecting", "นาฬิกาหลุด กำลังต่อใหม่...");
                                  scheduleReconnect();
                              }
                          }
                      } catch (Exception e) {
                          lastMsg = "BLE error: " + e.getMessage();
                      }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int status) {
                      try {
                          BluetoothGattService s = g.getService(SERVICE_UUID);
                          BluetoothGattCharacteristic c = s == null ? null : s.getCharacteristic(NOTIFY_UUID);
                          useB = false;
                          if (c == null) {
                              s = g.getService(SERVICE_B_UUID);
                              c = s == null ? null : s.getCharacteristic(NOTIFY_B_UUID);
                              useB = c != null;
                          }
                          if (c == null) {
                              setState("reconnecting", "ไม่พบบริการของนาฬิกาที่รองรับ ลองใหม่...");
                              g.disconnect();
                              return;
                          }
                          profile = useB ? "B" : "A";
                          g.setCharacteristicNotification(c, true);
                          BluetoothGattDescriptor d = c.getDescriptor(CCCD_UUID);
                          if (d != null) {
                              d.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              g.writeDescriptor(d);
                          } else {
                              setState("connected", "เชื่อมต่อนาฬิกาแล้ว");
                          }
                      } catch (Exception e) {
                          lastMsg = "BLE error: " + e.getMessage();
                      }
                  }

                  @Override
                  public void onDescriptorWrite(BluetoothGatt g, BluetoothGattDescriptor d, int status) {
                      if (status == BluetoothGatt.GATT_SUCCESS) setState("connected", "เชื่อมต่อนาฬิกาแล้ว");
                      else {
                          setState("reconnecting", "เปิดรับข้อมูลไม่สำเร็จ ลองใหม่...");
                          try { g.disconnect(); } catch (Exception e) { }
                      }
                  }

                  // Android 12 ลงไป
                  @Override
                  public void onCharacteristicChanged(BluetoothGatt g, BluetoothGattCharacteristic c) {
                      byte[] v = c.getValue();
                      if (v != null) dispatch(v);
                  }

                  // Android 13 ขึ้นไป
                  @Override
                  public void onCharacteristicChanged(BluetoothGatt g, BluetoothGattCharacteristic c, byte[] value) {
                      if (value != null) dispatch(value);
                  }
              };

              private void dispatch(byte[] raw) {
                  if (useB) handlePacketB(raw); else handlePacket(raw);
              }

              // ---------- นาฬิกาแบบที่ 2: ผลวัดมาทีละอย่าง  5A len 10 type ค่า... checksum ----------
              // type 01 = หัวใจ (1 ไบต์), 04 = SpO2 (1 ไบต์), 02 = ความดัน (บน, ล่าง)
              // ในแพ็กเก็ตไม่มีเวลา จึงใช้เวลาที่มือถือรับ (ตอนวัดเสร็จ)
              private void handlePacketB(byte[] raw) {
                  int[] d = new int[raw.length];
                  for (int i = 0; i < raw.length; i++) d[i] = raw[i] & 0xFF;
                  if (d.length < 6 || d[0] != 0x5A || d[1] != d.length || d[2] != 0x10) return;
                  int type = d[3];
                  JSONObject o = new JSONObject();
                  String k;
                  try {
                      if (type == 0x01) {
                          int h = d[4];
                          if (h < 30 || h > 220) return;
                          hr = h; k = "hr"; o.put("heartRate", h);
                      } else if (type == 0x04) {
                          int sp = d[4];
                          if (sp < 70 || sp > 100) return;
                          spo2 = sp; k = "spo2"; o.put("spo2", sp);
                      } else if (type == 0x02 && d.length >= 7) {
                          int sy = d[4], di = d[5];
                          if (sy < 60 || sy > 250 || di < 30 || di > 150) return;
                          sys = sy; dia = di; k = "bp"; o.put("systolic", sy); o.put("diastolic", di);
                      } else {
                          return;
                      }
                      long now = System.currentTimeMillis();
                      String key = k + ":" + d[4] + (d.length >= 7 ? ":" + d[5] : "");
                      if (key.equals(lastBKey) && now - lastBMs < 3000) return; // แพ็กเก็ตซ้ำ
                      lastBKey = key; lastBMs = now;

                      SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
                      f.setTimeZone(TimeZone.getTimeZone("UTC"));
                      o.put("temperature", JSONObject.NULL);
                      o.put("measuredAt", f.format(new java.util.Date(now)));
                      kind = k;
                      lastPacketMs = now;
                      seq++;
                      StringBuilder sb = new StringBuilder();
                      if (hr > 0) sb.append("HR ").append(hr);
                      if (sys > 0) sb.append(sb.length() > 0 ? " • " : "").append("BP ").append(sys).append("/").append(dia);
                      if (spo2 > 0) sb.append(sb.length() > 0 ? " • " : "").append("SpO2 ").append(spo2).append("%");
                      updateNotif(sb.toString());
                      queue.add(o);
                      while (queue.size() > 500) queue.poll();
                  } catch (Exception e) {
                      return;
                  }
                  flush();
              }

              // ---------- แปลงแพ็กเก็ตนาฬิกาแบบที่ 1 Y19PRO (ตรงกับฝั่งเว็บ) ----------
              private void handlePacket(byte[] raw) {
                  int[] d = new int[raw.length];
                  for (int i = 0; i < raw.length; i++) d[i] = raw[i] & 0xFF;
                  if (d.length < 20 || d[5] != 0x0E) return;
                  int sp = d[16], sy = d[17], di = d[18], h = d[19];
                  if (h < 30 || h > 220) return;
                  if (sp < 70 || sp > 100) return;
                  if (sy < 60 || sy > 250) return;
                  if (di < 30 || di > 150) return;

                  int sec = (d[13] << 16) | (d[14] << 8) | d[15];
                  if (sec >= 86400) return;

                  Calendar c = Calendar.getInstance();
                  long now = c.getTimeInMillis();
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  long t = c.getTimeInMillis() + sec * 1000L;
                  long diff = t - now;
                  if (diff > 12L * 3600 * 1000) t -= 86400L * 1000;
                  else if (diff < -12L * 3600 * 1000) t += 86400L * 1000;
                  SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
                  f.setTimeZone(TimeZone.getTimeZone("UTC"));
                  String at = f.format(new java.util.Date(t));
                  if (at.equals(lastQueuedAt)) return;
                  lastQueuedAt = at;

                  hr = h; sys = sy; dia = di; spo2 = sp;
                  clockLabel = String.format(Locale.US, "%02d:%02d:%02d", sec / 3600, (sec / 60) % 60, sec % 60);
                  lastPacketMs = System.currentTimeMillis();
                  seq++;
                  updateNotif("HR " + h + " • BP " + sy + "/" + di + " • SpO2 " + sp + "%");

                  try {
                      JSONObject o = new JSONObject();
                      o.put("heartRate", h);
                      o.put("systolic", sy);
                      o.put("diastolic", di);
                      o.put("spo2", sp);
                      o.put("temperature", JSONObject.NULL);
                      o.put("measuredAt", at);
                      queue.add(o);
                      while (queue.size() > 500) queue.poll();
                  } catch (Exception e) { }
                  flush();
              }

              // ---------- ส่งเข้าระบบ ----------
              private void flush() {
                  handler.removeCallbacks(flushRun);
                  if (!flushing.compareAndSet(false, true)) return;
                  net.execute(new Runnable() {
                      @Override public void run() {
                          boolean retry = false;
                          try {
                              JSONObject r;
                              while ((r = queue.peek()) != null) {
                                  int code = post(r);
                                  if ((code >= 200 && code < 300) || (code >= 400 && code < 500 && code != 401)) {
                                      queue.poll();
                                      if (code < 300) { sent.incrementAndGet(); lastMsg = "ส่งเข้าระบบแล้ว"; }
                                      else lastMsg = "ระบบปฏิเสธค่า (HTTP " + code + ")";
                                  } else {
                                      lastMsg = code == 401 ? "ต้องเข้าสู่ระบบใหม่ในแอป" : "ส่งไม่สำเร็จ จะลองใหม่";
                                      retry = true;
                                      break;
                                  }
                              }
                          } catch (Exception e) {
                              lastMsg = "ส่งไม่สำเร็จ (ไม่มีอินเทอร์เน็ต?) จะลองใหม่";
                              retry = true;
                          } finally {
                              flushing.set(false);
                          }
                          if (retry && !stopping) handler.postDelayed(flushRun, 20000);
                      }
                  });
              }

              private int post(JSONObject body) throws Exception {
                  if (baseUrl == null || baseUrl.length() == 0) return 0;
                  String cookie = CookieManager.getInstance().getCookie(baseUrl);
                  if (cookie == null || cookie.length() == 0) return 401;
                  HttpURLConnection con = (HttpURLConnection) new URL(baseUrl + "/api/vitals/mine").openConnection();
                  try {
                      con.setConnectTimeout(20000);
                      con.setReadTimeout(60000);
                      con.setRequestMethod("POST");
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json");
                      con.setRequestProperty("Cookie", cookie);
                      byte[] bytes = body.toString().getBytes("UTF-8");
                      OutputStream os = con.getOutputStream();
                      os.write(bytes);
                      os.close();
                      int code = con.getResponseCode();
                      InputStream is = code >= 400 ? con.getErrorStream() : con.getInputStream();
                      if (is != null) {
                          byte[] buf = new byte[1024];
                          while (is.read(buf) > 0) { }
                          is.close();
                      }
                      return code;
                  } finally {
                      con.disconnect();
                  }
              }

              // ---------- แจ้งเตือน / วงจรชีวิต ----------
              private Notification buildNotif(String text) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "การเชื่อมต่อนาฬิกา", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  b.setContentTitle("Smartwatch Vitals");
                  b.setContentText(text);
                  b.setSmallIcon(android.R.drawable.stat_sys_data_bluetooth);
                  b.setOngoing(true);
                  Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (open != null) {
                      int fl = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      b.setContentIntent(PendingIntent.getActivity(this, 0, open, fl));
                  }
                  return b.build();
              }

              private void startFg(Notification n) {
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
              }

              private void updateNotif(String text) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.notify(NOTIF_ID, buildNotif(text));
                  } catch (Exception e) { }
              }

              private void setState(String s, String msg) {
                  state = s;
                  lastMsg = msg;
                  updateNotif(msg);
              }

              private void shutdown() {
                  stopping = true;
                  running = false;
                  state = "idle";
                  getSharedPreferences("watch", MODE_PRIVATE).edit().putBoolean("on", false).apply();
                  handler.removeCallbacksAndMessages(null);
                  closeGatt();
                  try { stopForeground(true); } catch (Exception e) { }
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  stopping = true;
                  handler.removeCallbacksAndMessages(null);
                  closeGatt();
                  running = false;
                  net.shutdown();
                  super.onDestroy();
              }
          }
          JAVA_EOF
          cat > "$D/WatchBridgePlugin.java" <<'JAVA_EOF'
          package com.monk.smartwatchvitals;

          import android.content.Intent;
          import android.os.Build;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "WatchBridge",
              permissions = { @Permission(strings = { "android.permission.POST_NOTIFICATIONS" }, alias = "notif") }
          )
          public class WatchBridgePlugin extends Plugin {

              @PluginMethod
              public void start(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33 && getPermissionState("notif") != PermissionState.GRANTED) {
                      requestPermissionForAlias("notif", call, "notifDone");
                      return;
                  }
                  doStart(call);
              }

              @PermissionCallback
              private void notifDone(PluginCall call) {
                  doStart(call); // ไม่อนุญาตแจ้งเตือนก็ยังทำงานได้ แต่จะไม่เห็นแถบแจ้งเตือน
              }

              private void doStart(PluginCall call) {
                  String id = call.getString("deviceId");
                  if (id == null || id.length() == 0) { call.reject("ไม่มี deviceId"); return; }
                  Intent i = new Intent(getContext(), WatchService.class);
                  i.putExtra("mac", id);
                  i.putExtra("base", call.getString("baseUrl", ""));
                  try {
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                      else getContext().startService(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("เริ่มบริการไม่ได้: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  Intent i = new Intent(getContext(), WatchService.class);
                  i.setAction(WatchService.ACTION_STOP);
                  try { getContext().startService(i); } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void getStatus(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("running", WatchService.running);
                  o.put("state", WatchService.state);
                  o.put("hr", WatchService.hr);
                  o.put("sys", WatchService.sys);
                  o.put("dia", WatchService.dia);
                  o.put("spo2", WatchService.spo2);
                  o.put("seq", WatchService.seq);
                  o.put("sent", WatchService.sent.get());
                  o.put("pending", WatchService.queue.size());
                  o.put("msg", WatchService.lastMsg);
                  o.put("clock", WatchService.clockLabel);
                  o.put("profile", WatchService.profile);
                  o.put("kind", WatchService.kind);
                  // ค่าสดระหว่างวัดมีเฉพาะนาฬิกาแบบที่ 1 (Y19PRO)
                  o.put("measuring", "A".equals(WatchService.profile) && System.currentTimeMillis() - WatchService.lastPacketMs < 6000 && WatchService.seq > 0);
                  call.resolve(o);
              }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package com.monk.smartwatchvitals;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WatchBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['android.permission.FOREGROUND_SERVICE',
                   'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE',
                   'android.permission.POST_NOTIFICATIONS']
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          if add:
              s = s.replace('<application', add + '    <application', 1)
          if 'WatchService' not in s:
              svc = '        <service android:name=".WatchService" android:exported="false" android:foregroundServiceType="connectedDevice" />\n    '
              s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

