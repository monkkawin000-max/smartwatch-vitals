              for old in glob.glob(folder + '/ic_launcher*'):
                  os.remove(old)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(folder + '/ic_launcher.png')
              img.save(folder + '/ic_launcher_round.png')
          PY

      - name: สร้างไฟล์ APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: ตั้งชื่อไฟล์ APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk vitals-patient.apk

      - name: อัปโหลด APK
        uses: actions/upload-artifact@v4
        with:
          name: smartwatch-vitals-apk
          path: vitals-patient.apk
