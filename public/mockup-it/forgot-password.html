<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ช่วยเหลือลืมรหัส — IT</title>
<style>
  :root{
    --bg:#EEF3F2; --card:#FFFFFF; --ink:#17313E; --ink-dim:#5B7280;
    --teal:#0E7C86; --teal-deep:#0B5E66; --teal-soft:#DCEEEC;
    --danger:#D64545; --line:#DCE6E4;
    --mono:'JetBrains Mono',Consolas,monospace; --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); padding-bottom:60px; }

  .nav{ background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex;
        align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .nav .who{ font-size:13px; font-weight:700; }
  .nav .who span{ display:block; font-size:11px; font-weight:400; color:var(--ink-dim); }
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tabs a{ text-decoration:none; font-size:12px; padding:7px 12px; border-radius:9px; color:var(--ink-dim); white-space:nowrap; }
  .tabs a.active{ background:var(--teal-soft); color:var(--teal-deep); font-weight:700; }
  .logout{ font-size:12px; color:var(--danger); text-decoration:none; cursor:pointer; }

  .wrap{ max-width:760px; margin:0 auto; padding:20px 20px 0; }
  h1{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--ink-dim); font-size:13px; margin:0 0 18px; }

  .role-toggle{ display:flex; gap:8px; margin-bottom:18px; }
  .role-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    font-family:var(--sans); font-size:13.5px; font-weight:700; color:var(--ink-dim); cursor:pointer;
  }
  .role-toggle button.active{ background:var(--teal); color:#fff; border-color:var(--teal); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:20px; }
  .card h2{ font-size:14px; margin:0 0 4px; }
  .card .hint{ font-size:12px; color:var(--ink-dim); margin:0 0 16px; }
  label{ display:block; font-size:12px; color:var(--ink-dim); margin:0 0 6px; }
  input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-family:var(--sans); font-size:13.5px; margin-bottom:14px; background:#FBFDFC; color:var(--ink); }
  .btn{ border:none; border-radius:10px; padding:11px 20px; background:var(--teal); color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ background:var(--teal-deep); }
  .btn.small{ padding:7px 14px; font-size:12.5px; }
  .btn:disabled{ background:#9FB6B4; cursor:not-allowed; }

  .result-card{ display:none; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:6px; }
  .result-card .name{ font-weight:700; font-size:15px; }
  .result-card .code{ font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); margin-bottom:12px; }
  .result-card .row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px dashed var(--line); gap:10px; }
  .not-found{ color:var(--ink-dim); font-size:13px; padding:10px 0; }

  .reset-form{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .success-msg{ display:none; background:var(--teal-soft); color:var(--teal-deep); border-radius:10px; padding:9px 12px; font-size:12.5px; margin-top:10px; }
</style>
</head>
<body>

  <div class="nav">
    <div class="who" id="whoBox">จนท. IT <span>...</span></div>
    <div class="tabs">
      <a href="new-patient.html">ออกรหัสผู้ใช้ใหม่</a>
      <a href="forgot-password.html" class="active">ช่วยเหลือลืมรหัส</a>
      <a href="device-pairing.html">ลงทะเบียนอุปกรณ์</a>
    </div>
    <a class="logout" id="logoutLink">ออกจากระบบ</a>
  </div>

  <div class="wrap">
    <h1>ช่วยเหลือผู้ใช้ที่ลืมรหัส</h1>
    <p class="sub">ค้นหาผู้ใช้ที่ยังใช้งานอยู่ แล้วช่วยรีเซ็ตรหัสผ่านให้</p>

    <div class="role-toggle">
      <button id="tabPatient" class="active">คนไข้</button>
      <button id="tabDoctor">แพทย์</button>
    </div>

    <div class="card">
      <h2 id="searchTitle">ค้นหาคนไข้</h2>
      <p class="hint">ค้นหาด้วยชื่อ หรือรหัส</p>
      <input type="text" id="searchInput" placeholder="เช่น monk หรือ 001" />

      <div id="resultBox"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let currentRole = 'patient';
  let patients = [];
  let doctors = [];

  async function checkAuth(){
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    const data = await res.json();
    if (!data.loggedIn || data.user.role !== 'it'){
      window.location.href = 'login.html';
      return;
    }
    $('whoBox').innerHTML = `${data.user.name} <span>${data.user.username}</span>`;
  }
  $('logoutLink').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
    window.location.href = 'login.html';
  });

  async function loadAll(){
    const [pRes, dRes] = await Promise.all([
      fetch('/api/patients', { credentials:'include' }),
      fetch('/api/doctors', { credentials:'include' }),
    ]);
    patients = await pRes.json();
    doctors = await dRes.json();
  }

  function setRole(role){
    currentRole = role;
    $('tabPatient').classList.toggle('active', role === 'patient');
    $('tabDoctor').classList.toggle('active', role === 'doctor');
    $('searchTitle').textContent = role === 'patient' ? 'ค้นหาคนไข้' : 'ค้นหาแพทย์';
    $('searchInput').value = '';
    $('resultBox').innerHTML = '';
  }
  $('tabPatient').addEventListener('click', () => setRole('patient'));
  $('tabDoctor').addEventListener('click', () => setRole('doctor'));

  function doSearch(){
    const q = $('searchInput').value.trim().toLowerCase();
    const box = $('resultBox');
    if (!q){ box.innerHTML = ''; return; }

    const list = currentRole === 'patient' ? patients : doctors;
    const idKey = currentRole === 'patient' ? 'patientId' : 'doctorId';
    const match = list.find(x => x.active && (x.name.toLowerCase().includes(q) || x[idKey].toLowerCase().includes(q)));

    if (!match){
      box.innerHTML = `<div class="not-found">ไม่พบผู้ใช้ที่ใช้งานอยู่ตรงกับคำค้นนี้ (ถ้าบัญชีถูกปิดไปแล้ว ให้ไปที่หน้า "ออกรหัสผู้ใช้ใหม่" เพื่อเปิดบัญชีคืนแทน)</div>`;
      return;
    }

    box.innerHTML = `
      <div class="result-card" style="display:block;">
        <div class="name">${match.name}</div>
        <div class="code">รหัส: ${match[idKey]}</div>
        <div class="row">
          <span>สถานะบัญชี</span>
          <span style="color:var(--teal-deep); font-weight:700;">ใช้งานปกติ</span>
        </div>
        <div class="reset-form" id="resetForm" style="display:block;">
          <label>ตั้งรหัสผ่านใหม่</label>
          <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่สำหรับผู้ใช้รายนี้" />
          <button class="btn small" id="resetBtn">รีเซ็ตรหัสผ่าน</button>
          <div class="success-msg" id="successMsg">ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว</div>
        </div>
      </div>`;

    $('resetBtn').addEventListener('click', async () => {
      const newPassword = $('newPassword').value;
      if (!newPassword){ alert('กรุณาตั้งรหัสผ่านใหม่'); return; }
      $('resetBtn').disabled = true;
      $('resetBtn').textContent = 'กำลังบันทึก...';
      try {
        const res = await fetch('/api/auth/set-password', {
          method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
          body: JSON.stringify({ role: currentRole, id: match[idKey], newPassword }),
        });
        const data = await res.json();
        if (!res.ok){ alert(data.error || 'รีเซ็ตรหัสผ่านไม่สำเร็จ'); return; }
        $('successMsg').style.display = 'block';
        $('newPassword').value = '';
      } catch (err) {
        alert('เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่');
      } finally {
        $('resetBtn').disabled = false;
        $('resetBtn').textContent = 'รีเซ็ตรหัสผ่าน';
      }
    });
  }
  $('searchInput').addEventListener('input', doSearch);

  (async function init(){
    await checkAuth();
    await loadAll();
  })();
</script>
</body>
</html>
