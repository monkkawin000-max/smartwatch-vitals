<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — IT Staff</title>
<style>
  :root{
    --bg:#EEF3F2; --card:#FFFFFF; --ink:#17313E; --ink-dim:#5B7280;
    --teal:#0E7C86; --teal-deep:#0B5E66; --teal-soft:#DCEEEC;
    --danger:#D64545;
    --line:#DCE6E4; --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans);
        display:flex; align-items:center; justify-content:center; padding:20px; }
  .box{ width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 28px; }
  .logo{ width:52px; height:52px; border-radius:16px; background:linear-gradient(160deg,#1E3A3F,#0B5E66);
         display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .logo span{ color:#3FD6B4; font-size:22px; }
  h1{ font-size:18px; text-align:center; margin:0 0 4px; }
  p.sub{ text-align:center; color:var(--ink-dim); font-size:12.5px; margin:0 0 24px; }
  label{ display:block; font-size:12px; color:var(--ink-dim); margin:0 0 6px; }
  input{ width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
         font-family:var(--sans); font-size:14px; margin-bottom:14px; background:#FBFDFC; color:var(--ink); }
  .btn{ display:block; width:100%; text-align:center; text-decoration:none; border:none; border-radius:12px;
        padding:12px; background:var(--teal); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .btn:hover{ background:var(--teal-deep); }
  .btn:disabled{ background:#9FB6B4; cursor:not-allowed; }
  .error-box{
    display:none; background:#FDECEC; color:var(--danger); border:1px solid #F3C7C7;
    border-radius:10px; padding:9px 12px; font-size:12.5px; margin-bottom:14px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span>🛠</span></div>
    <h1>เข้าสู่ระบบเจ้าหน้าที่ IT</h1>
    <p class="sub">ระบบติดตามคนไข้หลังการรักษา</p>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" placeholder="เช่น itstaff1" autocomplete="username" required />

      <label>รหัสผ่าน</label>
      <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password" required />

      <button type="submit" class="btn" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';

    try {
      const res = await fetch('/api/auth/login/it', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // สำคัญ: ให้ browser เก็บ session cookie ไว้
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        errorBox.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ';
        errorBox.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'เข้าสู่ระบบ';
        return;
      }

      // login สำเร็จ -> ไปหน้าแรกของ IT staff
      window.location.href = 'new-patient.html';
    } catch (err) {
      errorBox.textContent = 'เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่';
      errorBox.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
</body>
</html>
