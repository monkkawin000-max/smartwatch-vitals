<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>รายงานสุขภาพ — Doctor</title>
<style>
  :root{
    --bg:#EEF3F2; --card:#FFFFFF; --ink:#17313E; --ink-dim:#5B7280;
    --teal:#0E7C86; --teal-deep:#0B5E66; --teal-soft:#DCEEEC;
    --danger:#D64545; --line:#DCE6E4;
    --mono:'JetBrains Mono',Consolas,monospace; --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); padding-bottom:60px; }

  .nav{ background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex;
        align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .nav .who{ font-size:13px; font-weight:700; }
  .nav .who span{ display:block; font-size:11px; font-weight:400; color:var(--ink-dim); }
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tabs a{ text-decoration:none; font-size:12px; padding:7px 12px; border-radius:9px; color:var(--ink-dim); white-space:nowrap; }
  .tabs a.active{ background:var(--teal-soft); color:var(--teal-deep); font-weight:700; }
  .logout{ font-size:12px; color:var(--danger); text-decoration:none; cursor:pointer; }

  .wrap{ max-width:760px; margin:0 auto; padding:20px 20px 0; }
  h1{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--ink-dim); font-size:13px; margin:0 0 20px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:20px; }
  .three-col{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
  @media (max-width:560px){ .three-col{ grid-template-columns:1fr; } }
  label{ display:block; font-size:12px; color:var(--ink-dim); margin:0 0 6px; }
  select, input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-family:var(--sans); font-size:13.5px; margin-bottom:14px; background:#FBFDFC; color:var(--ink); }
  .btn{ border:none; border-radius:10px; padding:11px 20px; background:var(--teal); color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn:hover{ background:var(--teal-deep); }
  .btn:disabled{ background:#9FB6B4; cursor:not-allowed; }
  .error-box{ background:#FDECEC; color:var(--danger); border:1px solid #F3C7C7; border-radius:10px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; }

  #reportArea{ display:none; }
  .report-head{ text-align:center; margin-bottom:18px; }
  .report-head h2{ margin:0 0 4px; font-size:17px; }
  .report-head p{ margin:0; font-size:12.5px; color:var(--ink-dim); }
  .no-data-msg{ text-align:center; color:var(--ink-dim); font-size:13.5px; padding:30px 10px; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  th, td{ text-align:center; padding:9px 6px; font-size:12.5px; border-bottom:1px solid var(--line); }
  th{ font-size:10.5px; text-transform:uppercase; color:var(--ink-dim); background:var(--teal-soft); }
  .summary-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
  .summary-row .box{ background:var(--teal-soft); border-radius:10px; padding:10px; text-align:center; }
  .summary-row .l{ font-size:10px; color:var(--teal-deep); text-transform:uppercase; }
  .summary-row .v{ font-family:var(--mono); font-size:17px; font-weight:700; }

  @media print{
    .nav, .card:first-of-type, .btn{ display:none !important; }
    body{ background:#fff; padding:0; }
    #reportArea{ display:block !important; }
  }
</style>
</head>
<body>

  <div class="nav">
    <div class="who" id="whoBox">... <span>...</span></div>
    <div class="tabs">
      <a href="dashboard.html">Dashboard</a>
      <a href="calendar.html">ปฏิทิน</a>
      <a href="report.html" class="active">รายงาน</a>
    </div>
    <a class="logout" id="logoutLink">ออกจากระบบ</a>
  </div>

  <div class="wrap">
    <h1>รายงานสุขภาพ</h1>
    <p class="sub">สรุปค่า Vital Signs ของคนไข้ในช่วงเวลาที่เลือก สำหรับพิมพ์/มอบให้คนไข้หรือญาติ</p>

    <div class="card">
      <div class="error-box" id="formError" style="display:none;"></div>
      <div class="three-col">
        <div>
          <label>คนไข้ (เฉพาะที่ใช้งานอยู่)</label>
          <select id="patientSelect"><option value="">— เลือกคนไข้ —</option></select>
        </div>
        <div>
          <label>จากวันที่</label>
          <input type="date" id="fromDate" />
        </div>
        <div>
          <label>ถึงวันที่</label>
          <input type="date" id="toDate" />
        </div>
      </div>
      <button class="btn" id="genBtn">สร้างรายงาน</button>
    </div>

    <div class="card" id="reportArea">
      <div class="report-head">
        <h2>รายงานสุขภาพคนไข้</h2>
        <p id="reportPatient">คนไข้: —</p>
        <p id="reportRange">ช่วงวันที่: —</p>
      </div>

      <div id="noDataBox" class="no-data-msg" style="display:none;">ไม่มีข้อมูลช่วงเวลานี้</div>

      <div id="dataBox" style="display:none;">
        <div class="summary-row" id="summaryRow"></div>
        <table>
          <thead><tr><th>วันที่</th><th>HR</th><th>BP</th><th>SpO2</th><th>Temp</th></tr></thead>
          <tbody id="dailyBody"></tbody>
        </table>
        <button class="btn" style="margin-top:18px;" id="printBtn">🖨 พิมพ์ / บันทึกเป็น PDF</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const monthNames = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  async function checkAuth(){
    const res = await fetch('/api/auth/me', { credentials:'include' });
    const data = await res.json();
    if (!data.loggedIn || data.user.role !== 'doctor'){
      window.location.href = 'login.html';
      return;
    }
    $('whoBox').innerHTML = `${data.user.name} <span>${data.user.doctorId}</span>`;
  }
  $('logoutLink').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
    window.location.href = 'login.html';
  });

  function fmtDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()+543}`;
  }

  async function loadPatients(){
    const res = await fetch('/api/patients', { credentials:'include' });
    const all = await res.json();
    const active = all.filter(p => p.active);
    $('patientSelect').innerHTML = '<option value="">— เลือกคนไข้ —</option>' +
      active.map(p => `<option value="${p.patientId}">${p.patientId} — ${p.name}</option>`).join('');
  }

  function setDefaultDates(){
    const today = new Date();
    const weekAgo = new Date(today.getTime() - 6 * 24 * 60 * 60 * 1000);
    const toStr = (d) => d.toISOString().slice(0, 10);
    $('fromDate').value = toStr(weekAgo);
    $('toDate').value = toStr(today);
  }

  $('genBtn').addEventListener('click', async () => {
    $('formError').style.display = 'none';
    const patientId = $('patientSelect').value;
    const from = $('fromDate').value;
    const to = $('toDate').value;

    if (!patientId){ showError('กรุณาเลือกคนไข้'); return; }
    if (!from || !to){ showError('กรุณาระบุช่วงวันที่'); return; }
    if (from > to){ showError('วันที่เริ่มต้นต้องมาก่อนวันที่สิ้นสุด'); return; }

    $('genBtn').disabled = true;
    $('genBtn').textContent = 'กำลังสร้าง...';

    try {
      const res = await fetch(`/api/vitals/stats/${encodeURIComponent(patientId)}?from=${from}&to=${to}`, { credentials:'include' });
      const data = await res.json();
      if (!res.ok){ showError(data.error || 'สร้างรายงานไม่สำเร็จ'); return; }

      const patientName = $('patientSelect').selectedOptions[0].textContent;
      $('reportPatient').textContent = `คนไข้: ${patientName}`;
      $('reportRange').textContent = `ช่วงวันที่: ${fmtDate(from)} - ${fmtDate(to)}`;
      $('reportArea').style.display = 'block';

      if (!data.hasData){
        $('noDataBox').style.display = 'block';
        $('dataBox').style.display = 'none';
      } else {
        $('noDataBox').style.display = 'none';
        $('dataBox').style.display = 'block';
        renderSummary(data.summary);
        renderDaily(data.daily);
      }
      $('reportArea').scrollIntoView({ behavior:'smooth' });
    } catch (err) {
      showError('เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่');
    } finally {
      $('genBtn').disabled = false;
      $('genBtn').textContent = 'สร้างรายงาน';
    }
  });

  function renderSummary(s){
    $('summaryRow').innerHTML = `
      <div class="box"><div class="l">HR เฉลี่ย</div><div class="v">${s.avgHeartRate} bpm</div></div>
      <div class="box"><div class="l">BP เฉลี่ย</div><div class="v">${s.avgSystolic}/${s.avgDiastolic}</div></div>
      <div class="box"><div class="l">SpO2 เฉลี่ย</div><div class="v">${s.avgSpo2}%</div></div>
      <div class="box"><div class="l">Temp เฉลี่ย</div><div class="v">${s.avgTemperature}°C</div></div>`;
  }

  function renderDaily(daily){
    $('dailyBody').innerHTML = daily.map(d => `
      <tr>
        <td>${fmtDate(d.date)}</td>
        <td>${d.avgHeartRate}</td>
        <td>${d.avgSystolic}/${d.avgDiastolic}</td>
        <td>${d.avgSpo2}%</td>
        <td>${d.avgTemperature}°C</td>
      </tr>`).join('');
  }

  function showError(msg){
    $('formError').textContent = msg;
    $('formError').style.display = 'block';
  }

  $('printBtn').addEventListener('click', () => window.print());

  (async function init(){
    await checkAuth();
    await loadPatients();
    setDefaultDates();
  })();
</script>
</body>
</html>
