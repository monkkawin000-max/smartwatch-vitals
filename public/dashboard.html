<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Dashboard — Vital Signs</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#EEF3F2; --card:#FFFFFF; --ink:#17313E; --ink-dim:#5B7280;
    --teal:#0E7C86; --teal-deep:#0B5E66; --teal-soft:#DCEEEC;
    --amber:#E8A33D; --danger:#D64545; --line:#DCE6E4;
    --mono:'JetBrains Mono', Consolas, monospace; --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .top{ max-width:1100px; margin:0 auto 22px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  h1{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--ink-dim); font-size:13px; margin:0; }
  .live{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim); }
  .live .dot{ width:8px; height:8px; border-radius:50%; background:var(--teal); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 50%{ opacity:.25; } }

  .wrap{ max-width:1100px; margin:0 auto; display:grid; grid-template-columns: 300px 1fr; gap:18px; align-items:start; }
  @media (max-width: 820px){ .wrap{ grid-template-columns: 1fr; } }

  /* ---------- patient list (ซ้าย) ---------- */
  .patient-list{ display:flex; flex-direction:column; gap:10px; }
  .p-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    cursor:pointer; transition: border-color .15s, box-shadow .15s;
  }
  .p-card:hover{ border-color: var(--teal); }
  .p-card.active{ border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
  .p-card .pid{ font-size:11px; color:var(--ink-dim); }
  .p-card .name{ font-weight:700; font-size:15px; margin-bottom:8px; }
  .p-mini{ display:grid; grid-template-columns: repeat(4,1fr); gap:4px; }
  .p-mini div{ text-align:center; }
  .p-mini .v{ font-family:var(--mono); font-size:13px; font-weight:700; }
  .p-mini .l{ font-size:9px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }
  .p-mini .v.abn{ color: var(--danger); }
  .p-card .time{ margin-top:8px; font-size:10.5px; color:var(--ink-dim); }
  .empty-list{ text-align:center; color:var(--ink-dim); font-size:13px; padding:30px 10px; background:var(--card); border-radius:14px; border:1px solid var(--line); }

  /* ---------- detail panel (ขวา) ---------- */
  .detail{ display:flex; flex-direction:column; gap:16px; }
  .headline{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 22px; }
  .headline .name{ font-size:18px; font-weight:700; }
  .headline .pid{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; }
  .stat-row{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  .stat{ background:var(--teal-soft); border-radius:12px; padding:10px 12px; }
  .stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-deep); }
  .stat .v{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--ink); }
  .stat .v.abn{ color: var(--danger); }
  .stat .u{ font-size:10px; color:var(--ink-dim); margin-left:2px; }

  .chart-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width: 560px){ .chart-grid{ grid-template-columns: 1fr; } }
  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px 8px; }
  .chart-card h3{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin:0 0 8px; }
  .chart-card canvas{ max-height:170px; }
  .no-data{ text-align:center; color:var(--ink-dim); font-size:13px; padding: 60px 20px; }
</style>
</head>
<body>

  <div class="top">
    <div>
      <h1>Doctor Dashboard</h1>
      <p class="sub">ค่า Vital Signs และแนวโน้มของคนไข้แต่ละคน</p>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <select id="patientDropdown" style="padding:9px 12px; border-radius:10px; border:1px solid var(--line); font-family:var(--sans); font-size:13px; background:#FFF; color:var(--ink); min-width:200px;">
        <option value="">— เลือกคนไข้ —</option>
      </select>
      <div class="live"><span class="dot"></span>อัปเดตอัตโนมัติทุก 5 วินาที</div>
    </div>
  </div>

  <div class="wrap">
    <div class="patient-list" id="patientList">
      <div class="empty-list">ยังไม่มีข้อมูลเข้ามา — เปิดหน้า emulator.html แล้วลองส่งค่าดูก่อน</div>
    </div>

    <div class="detail" id="detail" style="display:none;">
      <div class="headline">
        <div class="pid" id="dPid">—</div>
        <div class="name" id="dName">—</div>
        <div class="stat-row">
          <div class="stat"><div class="l">Heart Rate</div><div class="v" id="dHR">--<span class="u">bpm</span></div></div>
          <div class="stat"><div class="l">Blood Pressure</div><div class="v" id="dBP">--/--<span class="u">mmHg</span></div></div>
          <div class="stat"><div class="l">SpO2</div><div class="v" id="dSpo2">--<span class="u">%</span></div></div>
          <div class="stat"><div class="l">Temp</div><div class="v" id="dTemp">--<span class="u">°C</span></div></div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card"><h3>Heart Rate (bpm)</h3><canvas id="chartHR"></canvas></div>
        <div class="chart-card"><h3>Blood Pressure (mmHg)</h3><canvas id="chartBP"></canvas></div>
        <div class="chart-card"><h3>SpO2 (%)</h3><canvas id="chartSpo2"></canvas></div>
        <div class="chart-card"><h3>Temperature (°C)</h3><canvas id="chartTemp"></canvas></div>
      </div>
    </div>
  </div>

<script>
  const patientListEl = document.getElementById('patientList');
  const detailEl = document.getElementById('detail');
  let selectedPatientId = null;
  let charts = {};

  function isAbnormal(field, r){
    if (!r.hasData) return false;
    if (field === 'hr') return r.heartRate < 50 || r.heartRate > 120;
    if (field === 'sys') return r.systolic > 160 || r.systolic < 90;
    if (field === 'spo2') return r.spo2 < 92;
    if (field === 'temp') return r.temperature > 38.5;
    return false;
  }

  async function loadPatientList(){
    const res = await fetch('/api/patients/latest');
    const data = await res.json();
    const dropdown = document.getElementById('patientDropdown');

    if (!data.length){
      patientListEl.innerHTML = '<div class="empty-list">ยังไม่มีคนไข้ในระบบ — เปิดหน้า emulator.html แล้วเพิ่มคนไข้ดูก่อน</div>';
      dropdown.innerHTML = '<option value="">— ยังไม่มีคนไข้ —</option>';
      detailEl.style.display = 'none';
      return;
    }

    if (!selectedPatientId) selectedPatientId = data[0].patientId;

    // dropdown
    dropdown.innerHTML = data.map(r =>
      `<option value="${r.patientId}" ${r.patientId===selectedPatientId?'selected':''}>${r.patientId} — ${r.patientName}</option>`
    ).join('');

    // card list
    patientListEl.innerHTML = data.map(r => `
      <div class="p-card ${r.patientId === selectedPatientId ? 'active' : ''}" data-pid="${r.patientId}">
        <div class="pid">${r.patientId}</div>
        <div class="name">${r.patientName}</div>
        ${r.hasData ? `
        <div class="p-mini">
          <div><div class="v ${isAbnormal('hr',r)?'abn':''}">${r.heartRate}</div><div class="l">HR</div></div>
          <div><div class="v ${isAbnormal('sys',r)?'abn':''}">${r.systolic}/${r.diastolic}</div><div class="l">BP</div></div>
          <div><div class="v ${isAbnormal('spo2',r)?'abn':''}">${r.spo2}%</div><div class="l">SpO2</div></div>
          <div><div class="v ${isAbnormal('temp',r)?'abn':''}">${r.temperature}°</div><div class="l">Temp</div></div>
        </div>
        <div class="time">${new Date(r.timestamp).toLocaleString('th-TH')}</div>
        ` : `<div class="time">ยังไม่มีข้อมูล Vital Signs</div>`}
      </div>
    `).join('');

    function selectPatient(pid){
      selectedPatientId = pid;
      loadPatientList();
      loadDetail();
    }

    patientListEl.querySelectorAll('.p-card').forEach(el => {
      el.addEventListener('click', () => selectPatient(el.dataset.pid));
    });
    dropdown.onchange = () => selectPatient(dropdown.value);

    detailEl.style.display = 'flex';
  }

  function makeChart(ctx, label, color){
    return new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{
        label, data: [], borderColor: color, backgroundColor: color + '22',
        tension: 0.35, pointRadius: 2, fill: true, borderWidth: 2,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { display:false } },
        scales: {
          x: { ticks: { font: { size: 9 } }, grid: { display:false } },
          y: { ticks: { font: { size: 9 } }, grid: { color: '#EEF3F2' } },
        },
      }
    });
  }

  function ensureCharts(){
    if (charts.hr) return;
    charts.hr   = makeChart(document.getElementById('chartHR'),   'HR',  '#0E7C86');
    charts.sys  = makeChart(document.getElementById('chartBP'),   'Sys', '#0E7C86');
    charts.spo2 = makeChart(document.getElementById('chartSpo2'), 'SpO2','#3FA796');
    charts.temp = makeChart(document.getElementById('chartTemp'), 'Temp','#E8A33D');

    // เพิ่ม dataset diastolic เข้ากราฟ BP
    charts.sys.data.datasets.push({
      label: 'Dia', data: [], borderColor: '#E8A33D', backgroundColor: '#E8A33D22',
      tension: 0.35, pointRadius: 2, fill: true, borderWidth: 2,
    });
  }

  async function loadDetail(){
    if (!selectedPatientId) return;
    const res = await fetch('/api/vitals/' + encodeURIComponent(selectedPatientId));
    let records = await res.json();

    if (!records.length){
      document.querySelector('.chart-grid').style.display = 'none';
      let msg = document.getElementById('noDataMsg');
      if (!msg){
        msg = document.createElement('div');
        msg.id = 'noDataMsg';
        msg.className = 'no-data';
        msg.style.background = 'var(--card)';
        msg.style.border = '1px solid var(--line)';
        msg.style.borderRadius = '16px';
        document.querySelector('.detail').appendChild(msg);
      }
      msg.textContent = 'คนไข้รายนี้ยังไม่มีข้อมูล Vital Signs เข้ามา';
      msg.style.display = 'block';
      document.getElementById('dPid').textContent = selectedPatientId;
      const p = (await (await fetch('/api/patients')).json()).find(x => x.patientId === selectedPatientId);
      document.getElementById('dName').textContent = p ? p.name : selectedPatientId;
      ['dHR','dBP','dSpo2','dTemp'].forEach(id => document.getElementById(id).textContent = '--');
      return;
    }
    document.querySelector('.chart-grid').style.display = '';
    const msg = document.getElementById('noDataMsg');
    if (msg) msg.style.display = 'none';

    records = records.slice(0, 20).reverse(); // เก่า -> ใหม่ สำหรับกราฟ, จำกัด 20 จุดล่าสุด
    const latest = records[records.length - 1];

    document.getElementById('dPid').textContent = latest.patientId;
    document.getElementById('dName').textContent = latest.patientName;
    document.getElementById('dHR').innerHTML = latest.heartRate + '<span class="u">bpm</span>';
    document.getElementById('dHR').className = 'v' + (isAbnormal('hr',latest)?' abn':'');
    document.getElementById('dBP').innerHTML = latest.systolic + '/' + latest.diastolic + '<span class="u">mmHg</span>';
    document.getElementById('dBP').className = 'v' + (isAbnormal('sys',latest)?' abn':'');
    document.getElementById('dSpo2').innerHTML = latest.spo2 + '<span class="u">%</span>';
    document.getElementById('dSpo2').className = 'v' + (isAbnormal('spo2',latest)?' abn':'');
    document.getElementById('dTemp').innerHTML = latest.temperature + '<span class="u">°C</span>';
    document.getElementById('dTemp').className = 'v' + (isAbnormal('temp',latest)?' abn':'');

    ensureCharts();
    const labels = records.map(r => new Date(r.timestamp).toLocaleTimeString('th-TH', { hour12:false }));

    charts.hr.data.labels = labels;
    charts.hr.data.datasets[0].data = records.map(r => r.heartRate);
    charts.hr.update();

    charts.sys.data.labels = labels;
    charts.sys.data.datasets[0].data = records.map(r => r.systolic);
    charts.sys.data.datasets[1].data = records.map(r => r.diastolic);
    charts.sys.update();

    charts.spo2.data.labels = labels;
    charts.spo2.data.datasets[0].data = records.map(r => r.spo2);
    charts.spo2.update();

    charts.temp.data.labels = labels;
    charts.temp.data.datasets[0].data = records.map(r => r.temperature);
    charts.temp.update();
  }

  async function tick(){
    await loadPatientList();
    await loadDetail();
  }

  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
