<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ปฏิทินนัดหมาย — Patient</title>
<style>
  :root{
    --bg:#EEF3F2; --card:#FFFFFF; --ink:#17313E; --ink-dim:#5B7280;
    --teal:#0E7C86; --teal-deep:#0B5E66; --teal-soft:#DCEEEC;
    --line:#DCE6E4; --danger:#D64545;
    --mono:'JetBrains Mono',Consolas,monospace; --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); padding-bottom:60px; }

  .nav{ background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex;
        align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .nav .who{ font-size:13px; font-weight:700; }
  .nav .who span{ display:block; font-size:11px; font-weight:400; color:var(--ink-dim); }
  .tabs{ display:flex; gap:6px; }
  .tabs a{ text-decoration:none; font-size:12.5px; padding:7px 14px; border-radius:9px; color:var(--ink-dim); }
  .tabs a.active{ background:var(--teal-soft); color:var(--teal-deep); font-weight:700; }
  .logout{ font-size:12px; color:var(--danger); text-decoration:none; cursor:pointer; }

  .wrap{ max-width:480px; margin:0 auto; padding:22px 20px 0; }
  h1{ font-size:19px; margin:0 0 4px; }
  p.sub{ color:var(--ink-dim); font-size:12.5px; margin:0 0 20px; }

  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin: 20px 0 10px; }
  .appt-card{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--teal); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .appt-card.past{ border-left-color:#C4CFCE; opacity:.65; }
  .appt-card .date{ font-weight:700; font-size:15px; }
  .appt-card .time{ font-family:var(--mono); font-size:13px; color:var(--teal-deep); font-weight:700; }
  .appt-card .note{ font-size:12.5px; color:var(--ink-dim); margin-top:4px; }
  .appt-card .tag{ display:inline-block; font-size:10px; background:var(--teal-soft); color:var(--teal-deep); padding:2px 8px; border-radius:8px; margin-left:6px; }
  .empty{ text-align:center; color:var(--ink-dim); font-size:13px; padding:26px 10px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
</style>
</head>
<body>

  <div class="nav">
    <div class="who" id="whoBox">... <span>...</span></div>
    <div class="tabs">
      <a href="vitals.html">Smart Watch</a>
      <a href="calendar.html" class="active">ปฏิทิน</a>
    </div>
    <a class="logout" id="logoutLink">ออกจากระบบ</a>
  </div>

  <div class="wrap">
    <h1>นัดหมายของฉัน</h1>
    <p class="sub">รายการนัดหมายกับหมอ</p>

    <div class="section-title">นัดหมายที่จะถึง</div>
    <div id="upcomingList"></div>

    <div class="section-title">นัดหมายที่ผ่านมาแล้ว</div>
    <div id="pastList"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let myPatientId = null;

  async function checkAuth(){
    const res = await fetch('/api/auth/me', { credentials:'include' });
    const data = await res.json();
    if (!data.loggedIn || data.user.role !== 'patient'){
      window.location.href = 'login.html';
      return;
    }
    myPatientId = data.user.patientId;
    $('whoBox').innerHTML = `${data.user.name} <span>${data.user.patientId}</span>`;
  }
  $('logoutLink').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
    window.location.href = 'login.html';
  });

  function fmtDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()+543}`;
  }
  function todayStr(){
    const t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  }
  function renderCard(a, isPast){
    return `
      <div class="appt-card ${isPast ? 'past' : ''}">
        <div class="date">${fmtDate(a.date)} <span class="time">${a.time}</span> ${!isPast ? '<span class="tag">กำลังจะถึง</span>' : ''}</div>
        ${a.note ? `<div class="note">${a.note}</div>` : ''}
      </div>`;
  }

  async function loadAppointments(){
    const res = await fetch('/api/appointments?patientId=' + encodeURIComponent(myPatientId), { credentials:'include' });
    const appts = await res.json();
    const today = todayStr();

    const upcoming = appts.filter(a => a.date >= today).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    const past = appts.filter(a => a.date < today).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));

    $('upcomingList').innerHTML = upcoming.length
      ? upcoming.map(a => renderCard(a, false)).join('')
      : '<div class="empty">ยังไม่มีนัดหมายที่จะถึง</div>';

    $('pastList').innerHTML = past.length
      ? past.map(a => renderCard(a, true)).join('')
      : '<div class="empty">ไม่มีประวัตินัดหมายที่ผ่านมา</div>';
  }

  (async function init(){
    await checkAuth();
    await loadAppointments();
  })();
</script>
</body>
</html>
